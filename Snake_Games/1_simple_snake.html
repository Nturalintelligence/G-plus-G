<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Змейка №1: Классическая (Simple Snake)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .game-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    h1 { font-size: 24px; color: #38bdf8; display: flex; align-items: center; gap: 8px; }
    .scoreboard {
      display: flex;
      gap: 20px;
      background: #0f172a;
      padding: 10px 20px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 16px;
    }
    .score-val { color: #4ade80; }
    canvas {
      background: #090d16;
      border: 2px solid #334155;
      border-radius: 12px;
      display: block;
    }
    .controls-hint {
      font-size: 13px;
      color: #94a3b8;
      text-align: center;
    }
    button {
      background: #0284c7;
      color: white;
      border: 0;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #0369a1; }
  </style>
</head>
<body>

  <div class="game-card">
    <h1>🐍 1. Классическая Простая Змейка</h1>
    <div class="scoreboard">
      <div>Счёт: <span id="score" class="score-val">0</span></div>
      <div>Рекорд: <span id="high-score" class="score-val">0</span></div>
    </div>
    <canvas id="game" width="400" height="400"></canvas>
    <div class="controls-hint">Управление: Стрелки / WASD | Пауза: Пробел</div>
    <button id="restart-btn" onclick="resetGame()">Заново</button>
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const highScoreEl = document.getElementById("high-score");

    const GRID_SIZE = 20;
    const COUNT = canvas.width / GRID_SIZE;

    let snake = [{ x: 10, y: 10 }];
    let dx = 1, dy = 0;
    let food = { x: 15, y: 15 };
    let score = 0;
    let highScore = localStorage.getItem("snake_simple_hs") || 0;
    highScoreEl.textContent = highScore;

    function randomFood() {
      food = {
        x: Math.floor(Math.random() * COUNT),
        y: Math.floor(Math.random() * COUNT)
      };
    }

    function gameLoop() {
      const head = { x: snake[0].x + dx, y: snake[0].y + dy };

      if (head.x < 0 || head.x >= COUNT || head.y < 0 || head.y >= COUNT) {
        return resetGame();
      }

      for (let segment of snake) {
        if (segment.x === head.x && segment.y === head.y) {
          return resetGame();
        }
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.textContent = score;
        if (score > highScore) {
          highScore = score;
          highScoreEl.textContent = highScore;
          localStorage.setItem("snake_simple_hs", highScore);
        }
        randomFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function draw() {
      ctx.fillStyle = "#090d16";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = "#1e293b";
      for (let i = 0; i < canvas.width; i += GRID_SIZE) {
        ctx.beginPath();
        ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i); ctx.lineTo(canvas.width, i);
        ctx.stroke();
      }

      ctx.fillStyle = "#ef4444";
      ctx.beginPath();
      ctx.arc(food.x * GRID_SIZE + GRID_SIZE/2, food.y * GRID_SIZE + GRID_SIZE/2, GRID_SIZE/2 - 2, 0, Math.PI * 2);
      ctx.fill();

      snake.forEach((seg, i) => {
        ctx.fillStyle = i === 0 ? "#4ade80" : "#22c55e";
        ctx.fillRect(seg.x * GRID_SIZE + 1, seg.y * GRID_SIZE + 1, GRID_SIZE - 2, GRID_SIZE - 2);
      });
    }

    function resetGame() {
      snake = [{ x: 10, y: 10 }];
      dx = 1; dy = 0;
      score = 0;
      scoreEl.textContent = 0;
      randomFood();
      draw();
    }

    window.addEventListener("keydown", (e) => {
      if ((e.key === "ArrowUp" || e.key === "w" || e.key === "W") && dy !== 1) { dx = 0; dy = -1; }
      else if ((e.key === "ArrowDown" || e.key === "s" || e.key === "S") && dy !== -1) { dx = 0; dy = 1; }
      else if ((e.key === "ArrowLeft" || e.key === "a" || e.key === "A") && dx !== 1) { dx = -1; dy = 0; }
      else if ((e.key === "ArrowRight" || e.key === "d" || e.key === "D") && dx !== -1) { dx = 1; dy = 0; }
    });

    setInterval(gameLoop, 110);
    draw();
  </script>
</body>
</html>
