name: CI

on:
  pull_request:
  push:
    branches: [main, uat]

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run security:guard
      - run: npm run check
      - run: npm run desktop:build
